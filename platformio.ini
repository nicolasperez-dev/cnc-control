[platformio]
default_envs = controller, gateway
src_dir = src

[env]
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags = -I include

[env:controller]
platform = espressif32@6.12.0
board = esp32dev
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
build_src_filter = +<controller/>
build_flags = ${env.build_flags} -D CORE_DEBUG_LEVEL=0

[env:gateway]
platform = espressif8266@4.2.1
board = nodemcuv2
build_src_filter = +<gateway/>
lib_ignore = TFT_eSPI
build_flags = ${env.build_flags} -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -D VTABLES_IN_FLASH
